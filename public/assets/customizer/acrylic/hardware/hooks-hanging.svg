<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="200" height="150" fill="#f8fafc"/>
  <rect x="25" y="25" width="150" height="100" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="40" y="35" width="120" height="80" fill="#cbd5e1" opacity="0.4"/>
  <!-- Left hook bracket -->
  <g filter="url(#shadow)">
    <rect x="45" y="42" width="24" height="28" rx="2" fill="url(#metal)"/>
    <circle cx="57" cy="48" r="2.5" fill="#334155"/>
    <path d="M52 56 Q57 63 62 56" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Right hook bracket -->
  <g filter="url(#shadow)">
    <rect x="131" y="42" width="24" height="28" rx="2" fill="url(#metal)"/>
    <circle cx="143" cy="48" r="2.5" fill="#334155"/>
    <path d="M138 56 Q143 63 148 56" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Hanging wire representation -->
  <path d="M57 56 Q100 80 143 56" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2" fill="none"/>
</svg>