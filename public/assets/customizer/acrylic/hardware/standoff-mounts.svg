<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="bolt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="200" height="150" fill="#f8fafc"/>
  <!-- Acrylic plaque corner -->
  <rect x="35" y="25" width="130" height="100" rx="6" fill="#e0f2fe" opacity="0.5" stroke="#0284c7" stroke-width="1.5"/>
  <!-- 4 Chrome Standoff Bolts in 4 corners -->
  <g filter="url(#bolt-glow)">
    <!-- Top-left -->
    <circle cx="55" cy="45" r="12" fill="url(#chrome)" stroke="#334155" stroke-width="1"/>
    <circle cx="55" cy="45" r="4" fill="#64748b"/>
    <!-- Top-right -->
    <circle cx="145" cy="45" r="12" fill="url(#chrome)" stroke="#334155" stroke-width="1"/>
    <circle cx="145" cy="45" r="4" fill="#64748b"/>
    <!-- Bottom-left -->
    <circle cx="55" cy="105" r="12" fill="url(#chrome)" stroke="#334155" stroke-width="1"/>
    <circle cx="55" cy="105" r="4" fill="#64748b"/>
    <!-- Bottom-right -->
    <circle cx="145" cy="105" r="12" fill="url(#chrome)" stroke="#334155" stroke-width="1"/>
    <circle cx="145" cy="105" r="4" fill="#64748b"/>
  </g>
</svg>