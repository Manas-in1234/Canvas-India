<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="#f8fafc"/>
  <!-- Outer Gold Frame -->
  <rect x="25" y="15" width="150" height="120" rx="3" fill="url(#gold)" stroke="#78350f" stroke-width="1.5"/>
  <!-- Inner acrylic display area -->
  <rect x="42" y="32" width="116" height="86" fill="#0f172a" opacity="0.85"/>
  <rect x="44" y="34" width="112" height="82" fill="#e0f2fe" opacity="0.3"/>
  <text x="100" y="80" fill="#fef08a" font-size="12" font-family="Georgia" font-weight="bold" text-anchor="middle">Brushed Gold</text>
</svg>