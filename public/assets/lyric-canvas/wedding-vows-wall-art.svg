<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Canvas Drop Shadow -->
    <filter id="canvasShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.22" />
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <!-- Subtle canvas weave pattern -->
    <pattern id="canvasTexture" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#000000" stroke-width="0.35" opacity="0.04" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="topEdgeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="60%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="50%" stop-color="#FEF9C3" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
  </defs>

  <!-- Background Canvas Staging Environment -->
  <rect width="100%" height="100%" fill="#F8FAFC" />

  <!-- 3D Canvas Assembly with realistic Perspective wrap -->
  <g transform="translate(45, 30)">
    <!-- Main 3D Canvas Group with shadow -->
    <g filter="url(#canvasShadow)">
      <!-- Right 3D Fold Edge (Thickness flap) -->
      <polygon points="280,25 305,42 305,225 280,210" fill="url(#edgeGrad)" />

      <!-- Top 3D Fold Edge -->
      <polygon points="10,25 280,25 305,42 35,42" fill="url(#topEdgeGrad)" opacity="0.4" />

      <!-- Front Canvas Face (270 x 185) -->
      <g transform="translate(10, 25)">
        <clipPath id="frontFaceClip_TurnWeddingVowsintoWallArt">
          <rect width="270" height="185" rx="3" />
        </clipPath>

        <rect width="270" height="185" rx="3" fill="#FFFFFF" />

        <g clip-path="url(#frontFaceClip_TurnWeddingVowsintoWallArt)">
          
      <!-- Split design: Left 40% photo, Right 60% parchment vows -->
      <rect x="0" y="0" width="108" height="185" fill="#E2E8F0" />
      <!-- Couple holding hands / rings icon -->
      <rect x="0" y="0" width="108" height="185" fill="#334155" />
      <circle cx="54" cy="70" r="30" fill="#64748B" />
      <!-- Hands holding graphic -->
      <path d="M 20 120 C 35 90 70 90 88 120 Z" fill="#94A3B8" />
      <circle cx="54" cy="115" r="7" fill="none" stroke="#FDE047" stroke-width="2.5" />
      <!-- Right Parchment -->
      <rect x="108" y="0" width="162" height="185" fill="#FEFCE8" />
      <text x="189" y="36" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" font-weight="bold" fill="#854D0E" letter-spacing="1.5">WEDDING VOWS</text>
      <line x1="140" y1="43" x2="238" y2="43" stroke="#CA8A04" stroke-width="0.8" />
      <text x="189" y="62" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-size="9" fill="#1C1917">I take you to be my partner for life,</text>
      <text x="189" y="77" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-size="9" fill="#1C1917">To laugh with you in joy,</text>
      <text x="189" y="92" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-size="9" fill="#1C1917">To comfort you in sorrow,</text>
      <text x="189" y="107" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-size="9" fill="#1C1917">To cherish you through every storm.</text>
      <text x="189" y="125" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-size="10" font-weight="bold" fill="#A16207">Forever &amp; Always My Heart Is Yours</text>
      <text x="189" y="152" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="bold" fill="#78716C" letter-spacing="1">MICHAEL &amp; JESSICA</text>
      <text x="189" y="163" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="6.5" fill="#A8A29E">JUNE 22, 2024</text>
    
        </g>

        <!-- Canvas Weave Texture Overlay -->
        <rect width="270" height="185" rx="3" fill="url(#canvasTexture)" pointer-events="none" />
        <!-- Subtle border highlight -->
        <rect width="270" height="185" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4" />
      </g>
    </g>
  </g>
</svg>