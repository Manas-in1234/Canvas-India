<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas India</title>
    <script>
      // Single Page Apps for GitHub Pages / static hosts fallback
      // Redirect 404s back to root preserving full path
      const path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace('/' + (path.startsWith('/') ? path.substring(1) : path));
    </script>
  </head>
  <body class="bg-stone-50">
    <div style="font-family: sans-serif; text-align: center; padding-top: 15vh; color: #0E4A93;">
      <h2>Loading Canvas India...</h2>
    </div>
  </body>
</html>
