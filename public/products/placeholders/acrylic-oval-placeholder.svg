<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="ph-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#F8FAFC"/>
  <!-- Shape silhouette -->
  <g transform="scale(0.666) translate(10, 10)">
    <g filter="drop-shadow(0px 8px 16px rgba(15,23,42,0.12))">
      <g fill="url(#ph-grad)" stroke="#0E4A93" stroke-width="3">
        <ellipse cx="300" cy="300" rx="170" ry="220"/>
      </g>
    </g>
    <!-- Glare reflection -->
    <path d="M 0 0 L 200 0 L 100 600 L 0 600 Z" fill="#FFFFFF" opacity="0.4"/>
  </g>
  <text x="200" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0E4A93">Oval Acrylic Print</text>
  <text x="200" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Canvas India Optical Acrylic</text>
</svg>