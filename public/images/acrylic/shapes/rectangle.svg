<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <filter id="shadow-rectangle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="glare-rectangle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="chrome-rectangle" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <clipPath id="clip-rectangle">
      <use href="#r-shape" />
    </clipPath>
    <rect id="r-shape" x="20" y="15" width="160" height="120" rx="12" />
    <linearGradient id="g-rec" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1E3A8A"/><stop offset="50%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#93C5FD"/></linearGradient>
  </defs>

  <!-- Drop Shadow -->
  <g filter="url(#shadow-rectangle)">
    <use href="#r-shape" fill="#000000" opacity="0.2" />
  </g>

  <!-- Main Acrylic Plate with Image Art -->
  <g clip-path="url(#clip-rectangle)">
    <!-- Gradient Landscape/Art Representation -->
    <rect width="200" height="150" fill="url(#g-rec)" />
    
    <!-- Mountain/Horizon silhouettes representing photo art -->
    <path d="M 0 105 Q 50 67.5 100 97.5 T 200 82.5 L 200 150 L 0 150 Z" fill="#091E3A" opacity="0.35" />
    <circle cx="150" cy="52.5" r="18" fill="#FFF" opacity="0.3" />

    <!-- Glass Glare Reflection -->
    <rect width="200" height="150" fill="url(#glare-rectangle)" />
  </g>

  <!-- Optical Beveled Edge -->
  <use href="#r-shape" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85" />

  <!-- Standoff Chrome Bolts -->
  
    <g>
      <circle cx="30" cy="25" r="4" fill="url(#chrome-rectangle)" stroke="#1E293B" stroke-width="0.75" />
      <circle cx="30" cy="25" r="1.2" fill="#0F172A" />
    </g>
  
    <g>
      <circle cx="170" cy="25" r="4" fill="url(#chrome-rectangle)" stroke="#1E293B" stroke-width="0.75" />
      <circle cx="170" cy="25" r="1.2" fill="#0F172A" />
    </g>
  
    <g>
      <circle cx="30" cy="125" r="4" fill="url(#chrome-rectangle)" stroke="#1E293B" stroke-width="0.75" />
      <circle cx="30" cy="125" r="1.2" fill="#0F172A" />
    </g>
  
    <g>
      <circle cx="170" cy="125" r="4" fill="url(#chrome-rectangle)" stroke="#1E293B" stroke-width="0.75" />
      <circle cx="170" cy="125" r="1.2" fill="#0F172A" />
    </g>
  
</svg>