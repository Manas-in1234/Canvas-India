<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Wall Drop Shadow Filter -->
    <filter id="wall-shadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>

    <!-- Acrylic Edge Refraction Bevel -->
    <filter id="edge-bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>

    <!-- Photo Art Gradient -->
    <linearGradient id="grad-polaroid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e5f"/>
      <stop offset="35%" stop-color="#feb47b"/>
      <stop offset="70%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Standoff Chrome Finish -->
    <radialGradient id="metal-standoff" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>

    <!-- Glass Specular Glare -->
    <linearGradient id="glare-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Shape Clip Path -->
    <clipPath id="clip-polaroid">
      <rect x="140" y="100" width="320" height="400" rx="14"/>
    </clipPath>
  </defs>

  <!-- Clean Studio Wall Background -->
  <rect width="600" height="600" fill="#F8FAFC"/>
  <rect width="600" height="600" fill="radial-gradient(circle at 50% 40%, rgba(255,255,255,0.8) 0%, rgba(241,245,249,0.5) 100%)"/>

  <!-- Acrylic Floating Drop Shadow -->
  <g filter="url(#wall-shadow)">
    <g fill="#000000" opacity="0.3">
      <rect x="140" y="100" width="320" height="400" rx="14"/>
    </g>
  </g>

  <!-- 5mm Optical Acrylic Glass Plate Body -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4.5" filter="url(#edge-bevel)">
    <rect x="140" y="100" width="320" height="400" rx="14"/>
  </g>

  <!-- Inner Clipped Art & Glass Reflections -->
  
      <!-- Polaroid Inner Photo -->
      <rect x="165" y="125" width="270" height="250" rx="4" fill="url(#grad-polaroid)"/>
      <circle cx="300" cy="220" r="60" fill="#feb47b" opacity="0.85"/>
      <path d="M 165 310 Q 240 260 320 290 T 435 280 L 435 375 L 165 375 Z" fill="#2c3e50" opacity="0.95"/>
      <!-- Polaroid Gloss Sheen -->
      <path d="M 165 125 L 300 125 L 210 375 L 165 375 Z" fill="#FFFFFF" opacity="0.18"/>
      <!-- Polaroid Bottom Caption -->
      <text x="300" y="445" text-anchor="middle" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="28" fill="#334155">Golden Memories</text>
    

  <!-- Acrylic Outer Polished Crystal Bevel Edge -->
  <g fill="none" stroke="#0E4A93" stroke-width="1.8" opacity="0.3">
    <rect x="140" y="100" width="320" height="400" rx="14"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85">
    <rect x="140" y="100" width="320" height="400" rx="14"/>
  </g>

  <!-- Chrome Standoff Bolts -->
  
    <!-- Standoff Bolt -->
    <g transform="translate(175, 135)">
      <circle cx="0" cy="0" r="14" fill="#64748B" opacity="0.4" filter="blur(2px)"/>
      <circle cx="0" cy="0" r="11" fill="url(#metal-standoff)"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>
      <circle cx="0" cy="0" r="4.5" fill="#334155"/>
      <circle cx="-2" cy="-2" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    </g>
  
    <!-- Standoff Bolt -->
    <g transform="translate(425, 135)">
      <circle cx="0" cy="0" r="14" fill="#64748B" opacity="0.4" filter="blur(2px)"/>
      <circle cx="0" cy="0" r="11" fill="url(#metal-standoff)"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>
      <circle cx="0" cy="0" r="4.5" fill="#334155"/>
      <circle cx="-2" cy="-2" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    </g>
  
    <!-- Standoff Bolt -->
    <g transform="translate(175, 465)">
      <circle cx="0" cy="0" r="14" fill="#64748B" opacity="0.4" filter="blur(2px)"/>
      <circle cx="0" cy="0" r="11" fill="url(#metal-standoff)"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>
      <circle cx="0" cy="0" r="4.5" fill="#334155"/>
      <circle cx="-2" cy="-2" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    </g>
  
    <!-- Standoff Bolt -->
    <g transform="translate(425, 465)">
      <circle cx="0" cy="0" r="14" fill="#64748B" opacity="0.4" filter="blur(2px)"/>
      <circle cx="0" cy="0" r="11" fill="url(#metal-standoff)"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>
      <circle cx="0" cy="0" r="4.5" fill="#334155"/>
      <circle cx="-2" cy="-2" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    </g>
  

  <!-- Subtle Quality Badge -->
  <rect x="20" y="556" width="170" height="24" rx="6" fill="#0E4A93" opacity="0.9"/>
  <text x="105" y="572" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#FFFFFF">5mm Cast Optical Acrylic</text>
</svg>
