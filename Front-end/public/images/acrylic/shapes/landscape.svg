<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 130" width="220" height="130">
  <defs>
    <filter id="shadow-landscape" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="glare-landscape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="chrome-landscape" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <clipPath id="clip-landscape">
      <use href="#l-shape" />
    </clipPath>
    <rect id="l-shape" x="15" y="15" width="190" height="100" rx="12" />
    <linearGradient id="g-lan" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0F766E"/><stop offset="50%" stop-color="#14B8A6"/><stop offset="100%" stop-color="#5EEAD4"/></linearGradient>
  </defs>

  <!-- Drop Shadow -->
  <g filter="url(#shadow-landscape)">
    <use href="#l-shape" fill="#000000" opacity="0.2" />
  </g>

  <!-- Main Acrylic Plate with Image Art -->
  <g clip-path="url(#clip-landscape)">
    <!-- Gradient Landscape/Art Representation -->
    <rect width="220" height="130" fill="url(#g-lan)" />
    
    <!-- Mountain/Horizon silhouettes representing photo art -->
    <path d="M 0 91 Q 55 58.5 110 84.5 T 220 71.5 L 220 130 L 0 130 Z" fill="#091E3A" opacity="0.35" />
    <circle cx="165" cy="45.5" r="15.6" fill="#FFF" opacity="0.3" />

    <!-- Glass Glare Reflection -->
    <rect width="220" height="130" fill="url(#glare-landscape)" />
  </g>

  <!-- Optical Beveled Edge -->
  <use href="#l-shape" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85" />

  <!-- Standoff Chrome Bolts -->
  
    <g>
      <circle cx="25" cy="25" r="4" fill="url(#chrome-landscape)" stroke="#1E293B" stroke-width="0.75" />
      <circle cx="25" cy="25" r="1.2" fill="#0F172A" />
    </g>
  
    <g>
      <circle cx="195" cy="25" r="4" fill="url(#chrome-landscape)" stroke="#1E293B" stroke-width="0.75" />
      <circle cx="195" cy="25" r="1.2" fill="#0F172A" />
    </g>
  
    <g>
      <circle cx="25" cy="105" r="4" fill="url(#chrome-landscape)" stroke="#1E293B" stroke-width="0.75" />
      <circle cx="25" cy="105" r="1.2" fill="#0F172A" />
    </g>
  
    <g>
      <circle cx="195" cy="105" r="4" fill="url(#chrome-landscape)" stroke="#1E293B" stroke-width="0.75" />
      <circle cx="195" cy="105" r="1.2" fill="#0F172A" />
    </g>
  
</svg>