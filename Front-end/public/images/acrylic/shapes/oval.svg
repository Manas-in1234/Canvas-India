<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <filter id="shadow-oval" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="glare-oval" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="chrome-oval" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <clipPath id="clip-oval">
      <use href="#o-shape" />
    </clipPath>
    <ellipse id="o-shape" cx="100" cy="75" rx="80" ry="55" />
    <linearGradient id="g-ova" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C2410C"/><stop offset="50%" stop-color="#F97316"/><stop offset="100%" stop-color="#FDBA74"/></linearGradient>
  </defs>

  <!-- Drop Shadow -->
  <g filter="url(#shadow-oval)">
    <use href="#o-shape" fill="#000000" opacity="0.2" />
  </g>

  <!-- Main Acrylic Plate with Image Art -->
  <g clip-path="url(#clip-oval)">
    <!-- Gradient Landscape/Art Representation -->
    <rect width="200" height="150" fill="url(#g-ova)" />
    
    <!-- Mountain/Horizon silhouettes representing photo art -->
    <path d="M 0 105 Q 50 67.5 100 97.5 T 200 82.5 L 200 150 L 0 150 Z" fill="#091E3A" opacity="0.35" />
    <circle cx="150" cy="52.5" r="18" fill="#FFF" opacity="0.3" />

    <!-- Glass Glare Reflection -->
    <rect width="200" height="150" fill="url(#glare-oval)" />
  </g>

  <!-- Optical Beveled Edge -->
  <use href="#o-shape" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85" />

  <!-- Standoff Chrome Bolts -->
  
    <g>
      <circle cx="100" cy="30" r="4" fill="url(#chrome-oval)" stroke="#1E293B" stroke-width="0.75" />
      <circle cx="100" cy="30" r="1.2" fill="#0F172A" />
    </g>
  
</svg>