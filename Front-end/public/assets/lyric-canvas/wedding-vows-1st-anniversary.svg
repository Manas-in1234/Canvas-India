<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Canvas Drop Shadow -->
    <filter id="canvasShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.22" />
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <!-- Subtle canvas weave pattern -->
    <pattern id="canvasTexture" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#000000" stroke-width="0.35" opacity="0.04" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="topEdgeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="60%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="50%" stop-color="#FEF9C3" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
  </defs>

  <!-- Background Canvas Staging Environment -->
  <rect width="100%" height="100%" fill="#F8FAFC" />

  <!-- 3D Canvas Assembly with realistic Perspective wrap -->
  <g transform="translate(45, 30)">
    <!-- Main 3D Canvas Group with shadow -->
    <g filter="url(#canvasShadow)">
      <!-- Right 3D Fold Edge (Thickness flap) -->
      <polygon points="280,25 305,42 305,225 280,210" fill="url(#edgeGrad)" />

      <!-- Top 3D Fold Edge -->
      <polygon points="10,25 280,25 305,42 35,42" fill="url(#topEdgeGrad)" opacity="0.4" />

      <!-- Front Canvas Face (270 x 185) -->
      <g transform="translate(10, 25)">
        <clipPath id="frontFaceClip_WeddingVowsonCanvasAnniversaryGift">
          <rect width="270" height="185" rx="3" />
        </clipPath>

        <rect width="270" height="185" rx="3" fill="#FFFFFF" />

        <g clip-path="url(#frontFaceClip_WeddingVowsonCanvasAnniversaryGift)">
          
      <!-- Evening couple silhouette with sunset warmth -->
      <rect width="270" height="185" fill="#1E293B" />
      <path d="M 0 0 L 270 0 L 270 120 L 0 120 Z" fill="linear-gradient(to bottom, #0F172A, #334155)" />
      <!-- Couple embracing silhouette in upper half -->
      <circle cx="120" cy="55" r="20" fill="#CBD5E1" />
      <circle cx="145" cy="58" r="18" fill="#E2E8F0" />
      <path d="M 95 120 C 95 80 170 80 170 120 Z" fill="#94A3B8" />
      <!-- Lower third vow banner -->
      <rect y="115" width="270" height="70" fill="#090D16" opacity="0.9" />
      <line y1="115" x2="270" y2="115" stroke="#E2E8F0" stroke-width="0.8" opacity="0.4" />
      <text x="135" y="132" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-size="11" font-weight="bold" fill="#FEF08A">"I Choose You Over and Over Again"</text>
      <text x="135" y="146" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="8" font-style="italic" fill="#E2E8F0">Without pause, without a doubt, in a heartbeat.</text>
      <text x="135" y="157" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="8" font-style="italic" fill="#E2E8F0">I'll keep choosing you.</text>
      <text x="135" y="174" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="bold" fill="#94A3B8" letter-spacing="2">1ST ANNIVERSARY VOW RENEWAL</text>
    
        </g>

        <!-- Canvas Weave Texture Overlay -->
        <rect width="270" height="185" rx="3" fill="url(#canvasTexture)" pointer-events="none" />
        <!-- Subtle border highlight -->
        <rect width="270" height="185" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4" />
      </g>
    </g>
  </g>
</svg>