<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Canvas Drop Shadow -->
    <filter id="canvasShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.22" />
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <!-- Subtle canvas weave pattern -->
    <pattern id="canvasTexture" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0 3 L 6 3 M 3 0 L 3 6" stroke="#000000" stroke-width="0.35" opacity="0.04" />
    </pattern>

    <!-- Gradients -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="topEdgeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="60%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="50%" stop-color="#FEF9C3" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
  </defs>

  <!-- Background Canvas Staging Environment -->
  <rect width="100%" height="100%" fill="#F8FAFC" />

  <!-- 3D Canvas Assembly with realistic Perspective wrap -->
  <g transform="translate(45, 30)">
    <!-- Main 3D Canvas Group with shadow -->
    <g filter="url(#canvasShadow)">
      <!-- Right 3D Fold Edge (Thickness flap) -->
      <polygon points="280,25 305,42 305,225 280,210" fill="url(#edgeGrad)" />

      <!-- Top 3D Fold Edge -->
      <polygon points="10,25 280,25 305,42 35,42" fill="url(#topEdgeGrad)" opacity="0.4" />

      <!-- Front Canvas Face (270 x 185) -->
      <g transform="translate(10, 25)">
        <clipPath id="frontFaceClip_WeddingFirstDanceSongLyrics">
          <rect width="270" height="185" rx="3" />
        </clipPath>

        <rect width="270" height="185" rx="3" fill="#FFFFFF" />

        <g clip-path="url(#frontFaceClip_WeddingFirstDanceSongLyrics)">
          
      <!-- Night ambiance with twinkle lights -->
      <rect width="270" height="185" fill="#0B132B" />
      <!-- Golden bokeh lights -->
      <circle cx="40" cy="30" r="12" fill="#FDE047" opacity="0.18" />
      <circle cx="110" cy="20" r="16" fill="#FDE047" opacity="0.12" />
      <circle cx="220" cy="35" r="14" fill="#FDE047" opacity="0.15" />
      <circle cx="80" cy="90" r="8" fill="#FDE047" opacity="0.2" />
      <!-- Couple dancing silhouette -->
      <circle cx="70" cy="70" r="22" fill="#E2E8F0" />
      <circle cx="95" cy="74" r="20" fill="#CBD5E1" />
      <path d="M 40 185 Q 70 115 110 185 Z" fill="#F8FAFC" opacity="0.9" />
      <path d="M 75 185 Q 98 120 125 185 Z" fill="#1C2541" />
      <!-- Frosted song card -->
      <rect x="135" y="20" width="125" height="145" rx="8" fill="#1E293B" opacity="0.8" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.3" />
      <text x="197" y="44" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="10" font-weight="bold" fill="#FDE047">OUR FIRST DANCE</text>
      <text x="197" y="56" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="7" font-weight="bold" fill="#94A3B8" letter-spacing="1">CAN'T HELP FALLING IN LOVE</text>
      <line x1="150" y1="64" x2="245" y2="64" stroke="#475569" stroke-width="0.8" />
      <text x="197" y="80" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-size="9" fill="#FFFFFF">Wise men say</text>
      <text x="197" y="93" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-size="9" fill="#FFFFFF">only fools rush in</text>
      <text x="197" y="106" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-size="9" fill="#FFFFFF">But I can't help falling</text>
      <text x="197" y="120" text-anchor="middle" font-family="'Dancing Script', cursive, serif" font-size="9.5" font-weight="bold" fill="#FEF08A">in love with you</text>
      <text x="197" y="148" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="bold" fill="#CBD5E1">EMMA &amp; NOAH</text>
    
        </g>

        <!-- Canvas Weave Texture Overlay -->
        <rect width="270" height="185" rx="3" fill="url(#canvasTexture)" pointer-events="none" />
        <!-- Subtle border highlight -->
        <rect width="270" height="185" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4" />
      </g>
    </g>
  </g>
</svg>