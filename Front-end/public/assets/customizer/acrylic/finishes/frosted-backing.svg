  <circle cx="70" cy="65" r="28" fill="#ffffff" opacity="0.4"/>
  <circle cx="130" cy="85" r="22" fill="#ffffff" opacity="0.3"/>
  <rect x="12" y="118" width="105" height="20" rx="4" fill="#0f172a" opacity="0.75"/>
