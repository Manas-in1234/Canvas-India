<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <defs>
    <radialGradient id="matteGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <filter id="softDiffuse">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="200" height="150" fill="url(#matteGlow)"/>
  <!-- Soft diffused light spot with no sharp glare -->
  <circle cx="100" cy="75" r="50" fill="#94a3b8" opacity="0.25" filter="url(#softDiffuse)"/>
  <!-- Fine velvet texture lines -->
  <rect x="20" y="20" width="160" height="110" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.4"/>
  <!-- Label tag -->
  <rect x="12" y="118" width="90" height="20" rx="4" fill="#0f172a" opacity="0.75"/>
  <text x="57" y="132" fill="#ffffff" font-size="10" font-family="Arial" font-weight="bold" text-anchor="middle">MATTE FINISH</text>
</svg>